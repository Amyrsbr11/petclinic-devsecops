# TP4 : ajout manuel de Prometheus comme source de données (Connections > Data sources).
# Ici : même source, déclarée en fichier et chargée automatiquement au démarrage de Grafana.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
