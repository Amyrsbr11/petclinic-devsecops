global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: petclinic-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:9967"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]