name: petclinic

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans le fichier .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d petclinic"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    build: ./api
    image: ${API_IMAGE:-petclinic-api:local}
    environment:
      SPRING_PROFILES_ACTIVE: postgres,spring-data-jpa
      POSTGRES_URL: jdbc:postgresql://db:5432/petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASS: ${POSTGRES_PASSWORD}
      # Actuator sur un port de management séparé, jamais publié vers l'hôte
      MANAGEMENT_SERVER_PORT: "9967"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports: ["127.0.0.1:8080:9966"]   # seule l'API métier est publiée
    expose: ["9967"]                 # métriques visibles uniquement sur les réseaux internes
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, monitoring]
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api]
    networks: [monitoring]
networks:
  backend:
  monitoring:

volumes:
  db-data:
  prometheus-data: