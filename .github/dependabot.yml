version: 2
updates:
  - package-ecosystem: maven
    directory: /api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      maven-deps: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }